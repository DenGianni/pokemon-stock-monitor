name: Pokémon Stock Monitor

on:
  schedule:
    - cron: '*/6 * * * *'   # elke 10 minuten (stabieler dan elke 5)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1          # alleen laatste commit → sneller

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # stabieler dan 3.13 op dit moment
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Alleen browsers installeren als ze niet in de cache zitten
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install-deps chromium
          fi

      - name: Run stock check
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python monitor.py

      - name: Save changed stock state
        if: success()
        run: |
          if git diff --quiet -- state.json; then
            echo "Geen statewijziging om te committen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update Pokémon stock state"
          git push
